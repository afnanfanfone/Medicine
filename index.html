<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3rd Year Med Student Dashboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #bb86fc;
            --accent-hover: #9965f4;
            --text: #e0e0e0;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Top Bar: Title & College Buttons */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            margin: 0;
            color: var(--accent);
            font-size: 1.4rem;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: var(--accent);
            color: #000;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        /* Dashboard Main Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: 2fr 1.2fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            height: calc(100vh - 85px);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card-header {
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            font-weight: bold;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        /* Textarea for Scratchpad & To-Do */
        textarea {
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            color: var(--text);
            border: none;
            padding: 12px;
            resize: none;
            font-family: inherit;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        textarea:focus {
            outline: none;
        }

        /* Mobile Responsive */
        @media (max-width: 1024px) {
            .grid-container {
                display: flex;
                flex-direction: column;
                height: auto;
            }
            .card {
                height: 400px;
            }
        }
    </style>
</head>
<body>

    <!-- TOP BAR: Title & College Buttons -->
    <div class="top-bar">
        <h1>3rd Year Medical Dashboard</h1>
        
        <div class="btn-group">
            <!-- 3 College Site Links (استبدل اللينكات بروابط كليتك) -->
            <a href="https://edugate.ksu.edu.sa/ksu/init" target="_blank" class="btn">🏫 College Portal</a>
            <a href="https://lms.ksu.edu.sa/" target="_blank" class="btn">📚 LMS / Blackboard</a>
            <a href="https://amboss.com" target="_blank" class="btn">🩺 AMBOSS / Q-Bank</a>
        </div>
    </div>

    <!-- MAIN DASHBOARD GRID -->
    <div class="grid-container">

        <!-- SECTION 0: Google Sheets Tracker (Spans 2 rows on left) -->
        <div class="card" style="grid-row: span 2;">
            <div class="card-header">📊 0. Lecture Progress Tracker (Google Sheets)</div>
            <!-- استبدل الرابط أدناه برابط الـ Published Embed الخاص بشيت المتابعة -->
            <iframe src="https://docs.google.com/spreadsheets/d/1m9Fyx_QZWZsb6vsAFG5ZUrGPBJUg69M4mSOIKG9iYqo/edit?usp=sharing"></iframe>
        </div>

        <!-- SECTION 1: Google Calendar & Tasks (Includes Agenda/Deadlines) -->
        <div class="card">
            <div class="card-header">📅 1. Google Calendar & tasks</div>
            <iframe src="https://calendar.google.com/calendar/u/0/r"></iframe>
        </div>

        <!-- SECTION 2: Google Drive Lectures -->
        <div class="card">
            <div class="card-header">📁 2. Google Drive Lectures</div>
            <!-- استبدل الرابط برابط Preview لمجلد الماديول من قوقل درايف -->
            <iframe src="https://drive.google.com/drive/my-drive"></iframe>
        </div>

        <!-- SECTION 4: General To-Do List (Auto-saved) -->
        <div class="card">
            <div class="card-header">✅ 4. General To-Do List</div>
            <textarea id="todoText" placeholder="- Finish Heart Failure slides&#10;- Do 20 AMBOSS questions&#10;- Review OSCE cardiovascular exam" oninput="saveData()"></textarea>
        </div>

        <!-- SECTION 5: Idea Scratchpad / Dump Box (Auto-saved) -->
        <div class="card">
            <div class="card-header">💡 5. Idea Dump Box</div>
            <textarea id="ideaText" placeholder="Dump any quick ideas, professor pearls, or clinical reminders here..." oninput="saveData()"></textarea>
        </div>

    </div>

    <script>
        // حفظ النصوص المكتوبة في قسم الـ To-Do والـ Ideas تلقائياً في المتصفح (Local Storage)
        function saveData() {
            localStorage.setItem('med_todo', document.getElementById('todoText').value);
            localStorage.setItem('med_ideas', document.getElementById('ideaText').value);
        }

        // استرجاع النصوص تلقائياً عند فتح الصفحة
        window.onload = function() {
            if(localStorage.getItem('med_todo')) {
                document.getElementById('todoText').value = localStorage.getItem('med_todo');
            }
            if(localStorage.getItem('med_ideas')) {
                document.getElementById('ideaText').value = localStorage.getItem('med_ideas');
            }
        }
    </script>

</body>
</html>
