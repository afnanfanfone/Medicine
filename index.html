<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3rd Year Med Student Dashboard</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --accent: #bb86fc;
            --accent-hover: #9965f4;
            --text: #e0e0e0;
            --border: #2a2a30;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar: Title & College Buttons */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            height: 40px;
        }

        h1 {
            margin: 0;
            color: var(--accent);
            font-size: 1.3rem;
            letter-spacing: 0.5px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: rgba(187,134,252,0.12);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: var(--accent);
            color: #000;
        }

        /* Dashboard Main Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: 1.8fr 1.1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 12px;
            height: calc(100vh - 82px);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: relative;
        }

        .card-header {
            padding: 8px 12px;
            background: rgba(255,255,255,0.03);
            font-weight: 600;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Small Action Buttons in Card Headers */
        .header-btn {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.75rem;
            background: rgba(187,134,252,0.15);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--accent);
            transition: 0.2s;
            font-weight: 600;
        }

        .header-btn:hover {
            background: var(--accent);
            color: #000;
        }

        /* Google Sheet Scaling Container */
        .sheet-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .sheet-iframe {
            width: 125%;
            height: 125%;
            border: none;
            transform: scale(0.8);
            transform-origin: 0 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        /* Textarea for Scratchpad & To-Do */
        textarea {
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            color: var(--text);
            border: none;
            padding: 10px;
            resize: none;
            font-family: inherit;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        textarea:focus {
            outline: none;
        }

        /* Mobile Responsive */
        @media (max-width: 1024px) {
            body { height: auto; overflow: auto; }
            .grid-container {
                display: flex;
                flex-direction: column;
                height: auto;
            }
            .card {
                height: 380px;
            }
            .sheet-iframe {
                width: 100%;
                height: 100%;
                transform: none;
            }
        }
    </style>
</head>
<body>

    <!-- TOP BAR: Title & College Buttons -->
    <div class="top-bar">
        <h1>3rd Year Medical Dashboard</h1>
        
        <div class="btn-group">
            <a href="https://edugate.ksu.edu.sa/ksu/init" target="_blank" class="btn">🏫 College Portal</a>
            <a href="https://lms.ksu.edu.sa/" target="_blank" class="btn">📚 LMS / Blackboard</a>
            <a href="https://amboss.com" target="_blank" class="btn">🩺 AMBOSS / Q-Bank</a>
        </div>
    </div>

    <!-- MAIN DASHBOARD GRID -->
    <div class="grid-container">

        <!-- COLUMN 1: Google Sheets Tracker with EDIT BUTTON -->
        <div class="card" style="grid-row: span 2;">
            <div class="card-header">
                <span>📊 0. Lecture Progress Tracker</span>
                <a href="https://docs.google.com/spreadsheets/d/1m9Fyx_QZWZsb6vsAFG5ZUrGPBJUg69M4mSOIKG9iYqo/edit?usp=sharing" target="_blank" class="header-btn">
                    ✏️ Edit Sheet
                </a>
            </div>
            <div class="sheet-container">
                <iframe class="sheet-iframe" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTon_ieYKJOxCH9ISQvfaPuuEtPd53OQxu2DigXQvjASJhrBK1PMmYwf9Oz3IsnRJgBEAvoxcX0DX57/pubhtml?widget=true&amp;headers=false"></iframe>
            </div>
        </div>

        <!-- COLUMN 2 TOP: Google Calendar -->
        <div class="card">
            <div class="card-header">
                <span>📅 1. Google Calendar</span>
                <a href="https://assistant.google.com/tasks" target="_blank" class="header-btn">
                    ☑️ Open Tasks
                </a>
            </div>
            <iframe src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Asia%2FRiyadh&showPrint=0&src=YWZuYW5mYW5mb25lQGdtYWlsLmNvbQ&color=%23039be5" style="border:0" width="100%" height="100%" frameborder="0" scrolling="no"></iframe>
        </div>

        <!-- COLUMN 3 TOP: General To-Do List -->
        <div class="card">
            <div class="card-header">✅ 2. General To-Do List</div>
            <textarea id="todoText" placeholder="- Finish Heart Failure slides&#10;- Do 20 AMBOSS questions&#10;- Review OSCE cardiovascular exam" oninput="saveData()"></textarea>
        </div>

        <!-- COLUMN 2 BOTTOM: Google Drive Lectures -->
        <div class="card">
            <div class="card-header">📁 3. Google Drive Lectures</div>
            <iframe src="https://drive.google.com/embeddedfolderview?id=11C9jc1dTIEq5FYpohQFXofGxSw9okxq6#list" width="100%" height="100%" frameborder="0"></iframe>
        </div>

        <!-- COLUMN 3 BOTTOM: Idea Dump Box -->
        <div class="card">
            <div class="card-header">💡 4. Idea Dump Box</div>
            <textarea id="ideaText" placeholder="Dump any quick ideas, professor pearls, or clinical reminders here..." oninput="saveData()"></textarea>
        </div>

    </div>

    <script>
        // Save scratchpad and to-do text automatically in browser local storage
        function saveData() {
            localStorage.setItem('med_todo', document.getElementById('todoText').value);
            localStorage.setItem('med_ideas', document.getElementById('ideaText').value);
        }

        // Restore text automatically on page load
        window.onload = function() {
            if(localStorage.getItem('med_todo')) {
                document.getElementById('todoText').value = localStorage.getItem('med_todo');
            }
            if(localStorage.getItem('med_ideas')) {
                document.getElementById('ideaText').value = localStorage.getItem('med_ideas');
            }
        }
    </script>

</body>
</html>
